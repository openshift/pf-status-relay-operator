---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-allow-egress-to-api-server
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  egress:
    - ports:
        - protocol: TCP
          port: 6443
  policyTypes:
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-allow-to-dns
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53
      # OpenShift DNS pods listen on 5353 behind the service port 53.
      - protocol: TCP
        port: 5353
      - protocol: UDP
        port: 5353
  policyTypes:
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-allow-from-api-server-to-webhook
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-allow-from-monitoring-to-metrics
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  ingress:
    - from:
        # Permit local clients, including the metrics and TLS e2e probes.
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8443
  policyTypes:
    - Ingress
